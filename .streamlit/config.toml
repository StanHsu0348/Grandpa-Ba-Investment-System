[theme]
base = "light"
font = "-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'PingFang TC', 'Microsoft JhengHei', Arial, sans-serif"
headingFont = "-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'PingFang TC', 'Microsoft JhengHei', Arial, sans-serif"
headingFontWeights = [700, 600, 600, 600, 600, 600]
baseRadius = "1rem"
buttonRadius = "full"
showWidgetBorder = false
showSidebarBorder = true
metricValueFontWeight = 700

# ---------------------------------------------------------------------------
# 淺色模式 — 白色畫布＋淺灰卡片背景，仿 Apple Stocks / 系統設定 App 的雙層視覺
# ---------------------------------------------------------------------------
[theme.light]
primaryColor = "#0071e3"
backgroundColor = "#f5f5f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#1d1d1f"
borderColor = "#d2d2d7"
linkColor = "#0071e3"
redColor = "#ff3b30"
orangeColor = "#ff9500"
greenColor = "#34c759"
blueColor = "#0071e3"
dataframeBorderColor = "#d2d2d7"
dataframeHeaderBackgroundColor = "#f5f5f7"

[theme.light.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f7"
borderColor = "#d2d2d7"

# ---------------------------------------------------------------------------
# 深色模式 — 對應 macOS/iOS 深色模式慣用色票
# ---------------------------------------------------------------------------
[theme.dark]
primaryColor = "#0a84ff"
backgroundColor = "#1c1c1e"
secondaryBackgroundColor = "#2c2c2e"
textColor = "#f5f5f7"
borderColor = "#38383a"
linkColor = "#0a84ff"
redColor = "#ff453a"
orangeColor = "#ff9f0a"
greenColor = "#30d158"
blueColor = "#0a84ff"
dataframeBorderColor = "#38383a"
dataframeHeaderBackgroundColor = "#2c2c2e"

[theme.dark.sidebar]
backgroundColor = "#000000"
secondaryBackgroundColor = "#1c1c1e"
borderColor = "#38383a"
