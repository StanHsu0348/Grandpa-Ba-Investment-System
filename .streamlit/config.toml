# ---------------------------------------------------------------------------
# 視覺系統 — 暖白畫布、深綠主色與霧金細節
#
# 注意 Streamlit 的主題設定「沒有」分模式的寫法：不存在 [theme.light] /
# [theme.dark] 這種區塊（1.50 為止皆然，設了會在啟動時印出
# "not a valid config option" 警告並整段忽略）。色票只有一組，寫在 [theme]
# 底下，由 base 決定要以淺色還是深色為基底。因此這裡採用淺色單一模式。
#
# 側邊欄可以用 [theme.sidebar] 覆寫，做出「側欄白、主畫布灰」的層次。
# ---------------------------------------------------------------------------
[theme]
base = "light"
font = "-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'PingFang TC', 'Microsoft JhengHei', Arial, sans-serif"
headingFont = "-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'PingFang TC', 'Microsoft JhengHei', Arial, sans-serif"
headingFontWeights = [700, 600, 600, 600, 600, 600]
baseRadius = "1rem"
buttonRadius = "full"
showWidgetBorder = true
showSidebarBorder = true

# 色票（原 [theme.light] 區塊，提升到 [theme] 才會實際生效）
primaryColor = "#244c3c"
backgroundColor = "#f7f7f2"
secondaryBackgroundColor = "#ffffff"
textColor = "#242c27"
borderColor = "#dedfd5"
linkColor = "#244c3c"
redColor = "#be5149"
orangeColor = "#a67828"
greenColor = "#34805b"
blueColor = "#244c3c"
dataframeBorderColor = "#dedfd5"
dataframeHeaderBackgroundColor = "#f7f7f2"

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f7f7f2"
borderColor = "#dedfd5"
